name: Build and Release Windows Installer

on:
  # 1. Al hacer push a main/master: compila el .exe y publica automáticamente en GitHub Releases si v<version> no existe o está incompleta
  push:
    branches:
      - main
      - master
    # 2. Al subir un tag (ej. v0.2.1): compila y publica/actualiza la Release con latest.yml
    tags:
      - 'v*'
  # 3. Botón manual "Run workflow" en la pestaña Actions de GitHub
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Versión opcional para el instalador (ej. 0.2.1). Déjalo vacío para usar package.json.'
        required: false
        default: ''
      publish_release:
        description: 'Publicar en GitHub Releases (sube .exe, .blockmap y latest.yml)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  release-windows:
    name: Compilar instalador nativo NSIS (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determinar versión y modo de publicación
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $isTag = "${{ github.ref_type }}" -eq "tag"
          $isManualPublish = ("${{ github.event_name }}" -eq "workflow_dispatch") -and ("${{ inputs.publish_release }}" -eq "true")

          if ($isTag) {
            $targetVersion = "${{ github.ref_name }}" -replace '^v', ''
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch" -and -not [string]::IsNullOrWhiteSpace("${{ inputs.release_version }}")) {
            $targetVersion = "${{ inputs.release_version }}" -replace '^v', ''
          } else {
            $targetVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          }

          $shouldPublish = $isTag -or $isManualPublish

          # En push a main/master: publicar automáticamente si la Release v<version> no existe o le falta .exe / latest.yml
          if (-not $shouldPublish -and "${{ github.event_name }}" -eq "push") {
            $releaseCheckUrl = "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$targetVersion"
            try {
              $headers = @{
                Authorization = "Bearer $env:GH_TOKEN"
                Accept = "application/vnd.github+json"
                "User-Agent" = "LibreDoc-Studio-CI"
              }
              $existing = Invoke-RestMethod -Uri $releaseCheckUrl -Headers $headers -Method Get
              $assetNames = @($existing.assets | ForEach-Object { $_.name })
              $hasLatestYml = $assetNames -contains "latest.yml"
              $hasExe = ($assetNames | Where-Object { $_ -like "LibreDoc-Studio-Setup-*.exe" }).Count -gt 0

              if ($existing.draft -eq $true -or -not $hasLatestYml -or -not $hasExe) {
                Write-Host "La Release v$targetVersion está incompleta (draft=$($existing.draft), latest.yml=$hasLatestYml, exe=$hasExe) -> se reparará y publicará automáticamente."
                $shouldPublish = $true
              } else {
                Write-Host "La Release v$targetVersion ya está completa en GitHub Releases; se compilará solo como artefacto."
              }
            } catch {
              Write-Host "La Release v$targetVersion aún no existe en GitHub Releases -> se publicará automáticamente con latest.yml."
              $shouldPublish = $true
            }
          }

          Write-Host "Evento: ${{ github.event_name }} | Versión objetivo: $targetVersion | Publicar Release: $shouldPublish"
          "version=$targetVersion" >> $env:GITHUB_OUTPUT
          "publish=$($shouldPublish.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Sincronizar versión en package.json para el instalador y latest.yml
        shell: pwsh
        run: |
          npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Instalar dependencias
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") {
            npm ci
          } else {
            npm install
          }

      - name: Recompilar módulo nativo better-sqlite3 para Electron (Windows x64)
        shell: pwsh
        run: npm run rebuild:native

      - name: Descargar binarios offline para Windows (qpdf + tessdata spa/eng)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run setup:assets

      - name: Verificar recursos offline obligatorios antes de empaquetar
        shell: pwsh
        run: |
          $requiredFiles = @(
            "resources/bin/win/qpdf/qpdf.exe",
            "resources/tessdata/spa.traineddata",
            "resources/tessdata/eng.traineddata",
            "resources/icons/icon.ico"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "Falta recurso obligatorio para empaquetado offline: $file"
              exit 1
            }
            $sizeMB = [Math]::Round((Get-Item $file).Length / 1MB, 2)
            Write-Host "OK: $file ($sizeMB MB)"
          }

      - name: Validar TypeScript (frontend y Electron)
        shell: pwsh
        run: npm run lint

      - name: Compilar Vite y bundles Electron
        shell: pwsh
        run: npm run build

      - name: Empaquetar instalador nativo NSIS (.exe) y generar latest.yml localmente
        shell: pwsh
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: |
          node scripts/prepare-ci-builder-config.mjs
          Write-Host "Ejecutando electron-builder (NSIS x64, compilación local)..."
          npx electron-builder --config electron-builder.ci.yml --win nsis --x64 --publish never

          $ver = "${{ steps.meta.outputs.version }}"
          $exeFile = Get-ChildItem -Path release -Filter "LibreDoc-Studio-Setup-*.exe" | Select-Object -First 1
          if (-not $exeFile) {
            Write-Error "No se generó LibreDoc-Studio-Setup-*.exe en release/."
            exit 1
          }

          # Si electron-builder no escribió release/latest.yml con --publish never, generarlo en formato exacto electron-updater
          if (-not (Test-Path "release/latest.yml")) {
            Write-Host "Generando release/latest.yml con SHA-512 real de $($exeFile.Name)..."
            $sha512 = [System.Security.Cryptography.SHA512]::Create()
            $stream = [System.IO.File]::OpenRead($exeFile.FullName)
            try {
              $sha512Bytes = $sha512.ComputeHash($stream)
            } finally {
              $stream.Dispose()
              $sha512.Dispose()
            }
            $sha512Base64 = [Convert]::ToBase64String($sha512Bytes)
            $releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            $blockmapPath = "$($exeFile.FullName).blockmap"
            $lines = @(
              "version: $ver"
              "files:"
              "  - url: $($exeFile.Name)"
              "    sha512: $sha512Base64"
              "    size: $($exeFile.Length)"
            )
            if (Test-Path $blockmapPath) {
              $lines += "    blockMapSize: $((Get-Item $blockmapPath).Length)"
            }
            $lines += @(
              "path: $($exeFile.Name)"
              "sha512: $sha512Base64"
              "releaseDate: '$releaseDate'"
            )
            $latestYml = ($lines -join "`n") + "`n"
            [System.IO.File]::WriteAllText((Join-Path (Resolve-Path "release").Path "latest.yml"), $latestYml, [System.Text.UTF8Encoding]::new($false))
          }

      - name: Verificar instalador NSIS, app-update.yml y latest.yml
        shell: pwsh
        run: |
          Get-ChildItem -Path release | Format-Table Name, Length
          $exeFiles = Get-ChildItem -Path release -Filter "LibreDoc-Studio-Setup-*.exe"
          if ($exeFiles.Count -eq 0) {
            Write-Error "No se generó el instalador NSIS LibreDoc-Studio-Setup-*.exe en release/."
            exit 1
          }

          $appUpdateYml = "release/win-unpacked/resources/app-update.yml"
          if (-not (Test-Path $appUpdateYml)) {
            Write-Error "No se generó $appUpdateYml; la app instalada no podría consultar GitHub Releases."
            exit 1
          }
          Write-Host "=== app-update.yml ==="
          Get-Content $appUpdateYml

          if (-not (Test-Path "release/latest.yml")) {
            Write-Error "Falta release/latest.yml requerido por electron-updater."
            exit 1
          }
          Write-Host "=== latest.yml ==="
          Get-Content "release/latest.yml"

      - name: Publicar Release en GitHub Releases con gh CLI (.exe, .blockmap y latest.yml)
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $tag = "v$ver"
          $exeFile = (Get-ChildItem -Path release -Filter "LibreDoc-Studio-Setup-*.exe" | Select-Object -First 1).FullName
          $blockmapFile = (Get-ChildItem -Path release -Filter "LibreDoc-Studio-Setup-*.exe.blockmap" | Select-Object -First 1).FullName
          $latestYmlFile = (Resolve-Path "release/latest.yml").Path

          # Verificar si ya existe la Release (por ejemplo un intento previo incompleto)
          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view $tag --repo "${{ github.repository }}" *> $null
          $releaseViewExit = $LASTEXITCODE
          $ErrorActionPreference = $prevEap
          if ($releaseViewExit -eq 0) {
            Write-Host "La Release $tag ya existe; se actualizarán/subirán los archivos con --clobber."
          } else {
            Write-Host "Creando borrador de Release $tag..."
            gh release create $tag `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "LibreDoc Studio $tag" `
              --notes "Actualización $tag de LibreDoc Studio para Windows x64 (nuevo ícono oficial, vista previa en vivo y conversor automático de PDF estático a PDF rellenable AcroForm)." `
              --draft
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Error creando la Release $tag en GitHub."
              exit 1
            }
          }

          # 1. Subir primero .exe y .blockmap
          $filesToUpload = @($exeFile)
          if ($blockmapFile) { $filesToUpload += $blockmapFile }
          Write-Host "Subiendo instalador y blockmap a $tag..."
          gh release upload $tag @filesToUpload --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Error subiendo instalador .exe/.blockmap a $tag."
            exit 1
          }

          # 2. Subir latest.yml AL FINAL para que ningún cliente vea latest.yml antes de que exista el .exe
          Write-Host "Subiendo latest.yml a $tag..."
          gh release upload $tag $latestYmlFile --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Error subiendo latest.yml a $tag."
            exit 1
          }

          # 3. Publicar la Release (draft=false) y marcar como Latest
          Write-Host "Publicando Release $tag (draft=false, latest=true)..."
          gh release edit $tag --repo "${{ github.repository }}" --draft=false --latest
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Error publicando Release $tag."
            exit 1
          }

          # 4. Verificar que .exe y latest.yml existan en GitHub Releases
          $publishedAssets = @((gh release view $tag --repo "${{ github.repository }}" --json assets | ConvertFrom-Json).assets | ForEach-Object { $_.name })
          Write-Host "Activos publicados en ${tag}: $($publishedAssets -join ', ')"
          $hasUploadedExe = ($publishedAssets | Where-Object { $_ -like "LibreDoc-Studio-Setup-*.exe" }).Count -gt 0
          if (-not ($publishedAssets -contains "latest.yml") -or -not $hasUploadedExe) {
            Write-Error "Verificación fallida: faltan activos obligatorios en la Release $tag (latest.yml y .exe)."
            exit 1
          }

      - name: Adjuntar instalador Windows (.exe) como artefacto descargable del workflow
        uses: actions/upload-artifact@v4
        with:
          name: LibreDoc-Studio-Setup-v${{ steps.meta.outputs.version }}-win-x64
          path: |
            release/LibreDoc-Studio-Setup-*.exe
            release/LibreDoc-Studio-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30
