appId: com.libredoc.studio
productName: LibreDoc Studio
copyright: Copyright © 2026 LibreDoc Studio

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/tesseract.js/**/*
  - node_modules/tesseract.js-core/**/*

# Binarios nativos de Windows (qpdf) y modelos OCR offline (spa/eng) fuera de app.asar
extraResources:
  - from: resources/bin/win/qpdf
    to: bin/win/qpdf
    filter:
      - "**/*"
      - "!README.md"
  - from: resources/tessdata
    to: tessdata
    filter:
      - "*.traineddata"
  - from: resources/icons
    to: icons
    filter:
      - "*.ico"
      - "*.png"

win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: LibreDoc-Studio-Setup-${version}.${ext}
  requestedExecutionLevel: asInvoker

# Instalador nativo NSIS (.exe, NO portable)
nsis:
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  installerHeaderIcon: resources/icons/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LibreDoc Studio
  uninstallDisplayName: LibreDoc Studio
  # CRÍTICO: Nunca borrar %APPDATA%\LibreDocStudio (base SQLite y workspaces) al actualizar o desinstalar
  deleteAppDataOnUninstall: false
  runAfterFinish: true

# ==============================================================================
# CONFIGURACIÓN DE PUBLICACIÓN Y AUTO-ACTUALIZACIÓN EN GITHUB RELEASES
# ==============================================================================
publish:
  provider: github
  owner: matkdark-cmyk
  repo: LibreDoc-Studio
  releaseType: release
